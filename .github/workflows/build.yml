name: Build and isolated safety tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B package
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Kernel guard in disposable network namespace only
        run: |
          sudo env MODESLEEP_NETNS_TEST=1 unshare --net sh -c 'ip link set lo up && python3 -m unittest discover -s tests -p test_kernel.py -v'
      - name: Package standalone worker and documentation
        run: |
          mkdir dist
          cp target/minecraft-mode-sleep-*.jar dist/
          python3 tools/package.py --output dist
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftModeSleep
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MinecraftModeSleep
          path: dist
      - name: Publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "MinecraftModeSleep $RELEASE_TAG" --prerelease --notes-file CHANGELOG.md
